name: Deploy (Docker → EC2)

# Builds the web image for arm64 (t4g), pushes it to GHCR, and rolls it out on the
# EC2 host over SSH. Inactive until the repository variable DEPLOY_HOST is set.
# Setup guide: deploy/README.md

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-docker
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-24.04-arm
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/1apply-web" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.APP_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_EXTENSION_ORIGIN=${{ secrets.NEXT_PUBLIC_EXTENSION_ORIGIN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy stack files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER || 'ubuntu' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/docker-compose.prod.yml,deploy/Caddyfile,docker/cron.sh"
          target: /opt/1apply
          strip_components: 1

      - name: Roll out
        uses: appleboy/ssh-action@v1.2.0
        env:
          WEB_IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER || 'ubuntu' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: WEB_IMAGE,GHCR_USER,GHCR_TOKEN
          # No script_stop: it injects an exit-code check after every line, which breaks
          # multi-line if/else blocks. `set -euo pipefail` below already stops on errors.
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /opt/1apply
            if [ ! -f .env ]; then echo "/opt/1apply/.env is missing — see deploy/README.md"; exit 1; fi

            # Pin the image for this release so restarts and manual `up` use the same build.
            if grep -q '^WEB_IMAGE=' .env; then
              sed -i "s|^WEB_IMAGE=.*|WEB_IMAGE=${WEB_IMAGE}|" .env
            else
              printf '\nWEB_IMAGE=%s\n' "$WEB_IMAGE" >> .env
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker logout ghcr.io

            web="$(docker compose -f docker-compose.prod.yml ps -q web)"
            for i in $(seq 1 40); do
              status="$(docker inspect -f '{{.State.Health.Status}}' "$web")"
              if [ "$status" = "healthy" ]; then echo "web is healthy"; break; fi
              if [ "$i" -eq 40 ]; then
                echo "web did not become healthy (status: $status)"
                docker compose -f docker-compose.prod.yml logs --tail 60 web
                exit 1
              fi
              sleep 3
            done

            docker image prune -f
